<div id="boot"><div class="bbox"><h1>Mesa de Derechos</h1><div id="bootmsg">Cargando…</div></div></div>
<script>/* Mesa de Derechos — versión web: inicio de sesión Microsoft + OneDrive (sustituye a la app del Mac) */

async function inflate(u8){var ds=new DecompressionStream("deflate-raw"),w=ds.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}

/* ---- el "host" que la app espera ---- */
function host(){return {web:true,
  readPatch:function(){return JSON.parse(JSON.stringify(base))},
  writePatch:function(s){try{push(JSON.parse(s));return {ok:1}}catch(e){return {error:e.message}}},
  saveFile:function(dir,name,b64){var bin=atob(b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);var p=(dir||APPDIR+"/Descargas")+"/"+name.replace(/[\/:]/g,"-");
    gf("PUT",dp(p)+"/content",new Blob([u]),{"Content-Type":"application/octet-stream"}).then(function(r){if(r.ok)r.json().then(function(j){if(j.webUrl)window.open(j.webUrl,"_blank")})});return {path:p}},
  reveal:function(){},info:function(){return {web:true,user:me.mail||me.userPrincipalName||""}},onUpdate:function(){},
  listDir:async function(rel,deep){var out=[];async function walk(p,depth){var url=dp(p)+"/children?$top=999&$select=name,size,lastModifiedDateTime,folder,file";while(url){var j;try{j=await gjson("GET",url)}catch(e){return}for(var i=0;i<(j.value||[]).length;i++){var x=j.value[i];if(x.name.charAt(0)==="."||x.name.indexOf("~$")===0)continue;var r=p+"/"+x.name;if(x.folder){if(depth<(deep||3))await walk(r,depth+1)}else out.push({rel:r,name:x.name,size:x.size||0,mtime:Date.parse(x.lastModifiedDateTime)||0})}url=j["@odata.nextLink"]||null}}await walk(rel,0);return out},
  openFile:async function(rel){var w=window.open("about:blank","_blank");try{var j=await gjson("GET",dp(rel)+"?$select=webUrl");if(w)w.location.href=j.webUrl;else location.href=j.webUrl;return {ok:1}}catch(e){if(w)w.close();return {error:e.message}}},
  revealFile:async function(rel){var p=String(rel).split("/").slice(0,-1).join("/");return this.openFile(p)},

  ms:{status:async function(){return {signedIn:true,user:me.mail||me.userPrincipalName||""}},loginStart:async function(){return {error:"Ya has iniciado sesión con Microsoft en esta versión web."}},loginWait:async function(){return {}},logout:async function(){try{localStorage.removeItem(TK)}catch(e){}location.href=auth()+"logout?post_logout_redirect_uri="+encodeURIComponent(RED);return {}},
    draft:async function(m){try{var rec=function(a){return (a||[]).filter(Boolean).map(function(x){return {emailAddress:{address:x}}})};var d=await gjson("POST","/me/messages",{subject:m.subject||"",body:{contentType:"HTML",content:m.html||""},toRecipients:rec(m.to),ccRecipients:rec(m.cc)});
      for(var i=0;i<(m.files||[]).length;i++){var rel=m.files[i],name=rel.split("/").pop(),buf=await (await gf("GET",dp(rel)+"/content")).arrayBuffer();
        if(buf.byteLength<3*1024*1024){var b="",u=new Uint8Array(buf);for(var k=0;k<u.length;k+=32768)b+=String.fromCharCode.apply(null,u.subarray(k,k+32768));await gjson("POST","/me/messages/"+d.id+"/attachments",{"@odata.type":"#microsoft.graph.fileAttachment",name:name,contentBytes:btoa(b)})}
        else{var s=await gjson("POST","/me/messages/"+d.id+"/attachments/createUploadSession",{AttachmentItem:{attachmentType:"file",name:name,size:buf.byteLength}}),CH=320*1024*12;for(var o=0;o<buf.byteLength;o+=CH){var part=buf.slice(o,Math.min(o+CH,buf.byteLength));var rr=await fetch(s.uploadUrl,{method:"PUT",headers:{"Content-Range":"bytes "+o+"-"+(o+part.byteLength-1)+"/"+buf.byteLength},body:part});if(rr.status>=300)throw new Error("No se ha podido adjuntar "+name)}}}

  invoke:async function(ch,a,b){

function addScript(code){var s=document.createElement("script");s.textContent=code;document.body.appendChild(s)}
function runApp(seed,W){window.__SEED=seed;window.mesaHost=host();if(W.icon){["apple-touch-icon","icon"].forEach(function(r){var l=document.createElement("link");l.rel=r;l.href="data:image/png;base64,"+W.icon;document.head.appendChild(l)})}var st=document.createElement("style");st.textContent=W.css;document.head.appendChild(st);document.title="Mesa de Derechos";
  var d=document.createElement("div");d.innerHTML=W.html;while(d.firstChild)document.body.appendChild(d.firstChild);(W.libs||[]).forEach(addScript);$("#boot").remove();addScript(W.app);
  setInterval(poll,60000);document.addEventListener("visibilitychange",function(){if(!document.hidden)poll()})}
function showLogin(err){msg((err?'<p class="berr">'+err+'</p>':"")+'<button class="bbtn" id="blogin">Entrar con Microsoft</button><p class="bnote">Usa tu cuenta de Luna Books. Tus datos se leen y se guardan en tu OneDrive.</p>');$("#blogin").onclick=function(){login()}}
function showSetup(){msg('<p>Pega los datos del registro de la app en Microsoft (Entra ID):</p><input id="bcid" placeholder="ID de aplicación (cliente)"><input id="bten" placeholder="ID de directorio (inquilino)"><button class="bbtn" id="bsave">Guardar</button>');$("#bsave").onclick=function(){var c={clientId:$("#bcid").value.trim(),tenant:$("#bten").value.trim()};if(!c.clientId)return;localStorage.setItem("mesa.web.cfg",JSON.stringify(c));location.reload()}}
async function boot(){if(!CFG.clientId){showSetup();return}

  if(qs.get("error")){history.replaceState(null,"",RED);if(qs.get("error")==="interaction_required"||qs.get("error")==="login_required"){showLogin();return}showLogin("Microsoft dice: "+(qs.get("error_description")||qs.get("error")));return}

})();
